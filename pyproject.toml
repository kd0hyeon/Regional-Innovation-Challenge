[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "veripi"
version = "0.1.0"
description = "Pre-install risk checker for slopsquatting / malicious PyPI packages"
requires-python = ">=3.9"
dependencies = ["packaging>=21.0"]

[project.optional-dependencies]
installed = ["pipdeptree>=2.0"]

[project.scripts]
veripi = "veripi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
